@keyframes wv0{from{transform:translateX(-500px)}to{transform:translateX(0px)}}.wv0{animation:wv0 15s linear infinite}@keyframes wv1{from{transform:translateX(0px)}to{transform:translateX(-400px)}}.wv1{animation:wv1 10s linear infinite}@keyframes wv2{from{transform:translateX(-300px)}to{transform:translateX(0px)}}.wv2{animation:wv2 7s linear infinite}@keyframes fl{0%{transform:translateY(0);opacity:0}15%{opacity:1}85%{opacity:.9}100%{transform:translateY(-140px);opacity:0}}.p0{animation:fl 11.01s -4.18s linear infinite}.p1{animation:fl 14.09s -4.58s linear infinite}.p2{animation:fl 9.72s -8.98s linear infinite}.p3{animation:fl 10.25s -4.87s linear infinite}.p4{animation:fl 13.49s -6.21s linear infinite}.p5{animation:fl 8s -2.69s linear infinite}.p6{animation:fl 12.78s -7.77s linear infinite}.p7{animation:fl 8.31s -3.59s linear infinite}.p8{animation:fl 8.94s -8.58s linear infinite}.p9{animation:fl 10.04s -4.57s linear infinite}.p10{animation:fl 13.46s -3.85s linear infinite}.p11{animation:fl 8.98s -8.53s linear infinite}.p12{animation:fl 14.29s -10.3s linear infinite}.p13{animation:fl 8.42s -0.46s linear infinite}.p14{animation:fl 7.63s -6.95s linear infinite}.p15{animation:fl 10.07s -4.41s linear infinite}.p16{animation:fl 15.61s -5.83s linear infinite}.p17{animation:fl 10.52s -7.9s linear infinite}.p18{animation:fl 12.76s -6.73s linear infinite}.p19{animation:fl 12.75s -3.05s linear infinite}.p20{animation:fl 10.23s -1.55s linear infinite}.p21{animation:fl 10.25s -3.64s linear infinite}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.a1{animation:rise .9s .1s both}.a2{animation:rise .9s .4s both}.a3{animation:rise .9s .7s both}
@keyframes glow{0%,100%{opacity:.5}50%{opacity:1}}.glow{animation:glow 4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
