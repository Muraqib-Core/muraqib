<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="t d">
<title id="t">Four things Muraqib watches</title>
<desc id="d">Four cards: Security, Performance, Architecture and Agent-ready, each with a short description and the guards behind it.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes sheen{0%{transform:translateX(-300px) skewX(-18deg)}30%,100%{transform:translateX(420px) skewX(-18deg)}}
@keyframes ico{0%,100%{opacity:.85}50%{opacity:1}}@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes bar{0%,100%{transform:scaleX(.35)}50%{transform:scaleX(1)}}.c0{animation:rise .8s 0.1s both}.s0{animation:sheen 8s 1.5s ease-in-out infinite}.i0{animation:ico 3.4s 0s ease-in-out infinite}.b0{transform-box:fill-box;transform-origin:left;animation:bar 5s 0s ease-in-out infinite}.c1{animation:rise .8s 0.25s both}.s1{animation:sheen 8s 2.8s ease-in-out infinite}.i1{animation:ico 3.4s 0.5s ease-in-out infinite}.b1{transform-box:fill-box;transform-origin:left;animation:bar 5s 0.6s ease-in-out infinite}.c2{animation:rise .8s 0.4s both}.s2{animation:sheen 8s 4.1s ease-in-out infinite}.i2{animation:ico 3.4s 1s ease-in-out infinite}.b2{transform-box:fill-box;transform-origin:left;animation:bar 5s 1.2s ease-in-out infinite}.c3{animation:rise .8s 0.5499999999999999s both}.s3{animation:sheen 8s 5.4s ease-in-out infinite}.i3{animation:ico 3.4s 1.5s ease-in-out infinite}.b3{transform-box:fill-box;transform-origin:left;animation:bar 5s 1.7999999999999998s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs><linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="cc0"><rect x="10" y="14" width="224" height="312" rx="18"/></clipPath><clipPath id="cc1"><rect x="262" y="14" width="224" height="312" rx="18"/></clipPath><clipPath id="cc2"><rect x="514" y="14" width="224" height="312" rx="18"/></clipPath><clipPath id="cc3"><rect x="766" y="14" width="224" height="312" rx="18"/></clipPath></defs>
<rect width="1000" height="340" fill="none"/><g class="c0">
<rect x="10" y="14" width="224" height="312" rx="18" fill="#151517" stroke="#2a2a2e"/>
<g clip-path="url(#cc0)"><rect x="10" y="14" width="224" height="3" fill="#E7A141" fill-opacity=".85"/><rect class="s0" x="10" y="14" width="90" height="312" fill="url(#sh)"/></g>
<text class="m" x="34" y="54" font-size="14" fill="#E7A141" font-weight="700">01</text>
<g class="i0" transform="translate(34 72)" fill="none" stroke="#E7A141" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#E7A141"><path d="M22 4 L37 10 V22 C37 31 30 37 22 41 C14 37 7 31 7 22 V10 Z" /><circle cx="22" cy="20" r="4"/><path d="M22 24 V30"/></g>
<text x="34" y="158" font-size="25" font-weight="700" fill="#f2f2f2">Security</text>
<text x="34" y="190" font-size="14.5" fill="#a1a1aa">Secrets, injection, auth,</text><text x="34" y="212" font-size="14.5" fill="#a1a1aa">crypto and HTTP security</text><text x="34" y="234" font-size="14.5" fill="#a1a1aa">headers.</text>
<rect x="34" y="264" width="176" height="2" rx="1" fill="#2a2a2e"/>
<rect class="b0" x="34" y="264" width="176" height="2" rx="1" fill="#E7A141"/>
<text class="m" x="34" y="296" font-size="12.5" fill="#6e6e77">secret · security</text>
</g><g class="c1">
<rect x="262" y="14" width="224" height="312" rx="18" fill="#151517" stroke="#2a2a2e"/>
<g clip-path="url(#cc1)"><rect x="262" y="14" width="224" height="3" fill="#E7A141" fill-opacity=".85"/><rect class="s1" x="262" y="14" width="90" height="312" fill="url(#sh)"/></g>
<text class="m" x="286" y="54" font-size="14" fill="#E7A141" font-weight="700">02</text>
<g class="i1" transform="translate(286 72)" fill="none" stroke="#E7A141" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#E7A141"><path d="M8 32 A16 16 0 1 1 36 32"/><path d="M22 26 L30 15"/><circle cx="22" cy="26" r="2.4" fill="currentColor"/><path d="M13 31H9M35 31H31M22 11V15" opacity=".55"/></g>
<text x="286" y="158" font-size="25" font-weight="700" fill="#f2f2f2">Performance</text>
<text x="286" y="190" font-size="14.5" fill="#a1a1aa">Memory, bundle budgets,</text><text x="286" y="212" font-size="14.5" fill="#a1a1aa">async patterns, dead code</text><text x="286" y="234" font-size="14.5" fill="#a1a1aa">and network latency.</text>
<rect x="286" y="264" width="176" height="2" rx="1" fill="#2a2a2e"/>
<rect class="b1" x="286" y="264" width="176" height="2" rx="1" fill="#E7A141"/>
<text class="m" x="286" y="296" font-size="12.5" fill="#6e6e77">memory · async · image</text>
</g><g class="c2">
<rect x="514" y="14" width="224" height="312" rx="18" fill="#151517" stroke="#2a2a2e"/>
<g clip-path="url(#cc2)"><rect x="514" y="14" width="224" height="3" fill="#E7A141" fill-opacity=".85"/><rect class="s2" x="514" y="14" width="90" height="312" fill="url(#sh)"/></g>
<text class="m" x="538" y="54" font-size="14" fill="#E7A141" font-weight="700">03</text>
<g class="i2" transform="translate(538 72)" fill="none" stroke="#E7A141" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#E7A141"><path d="M22 6 L38 14 L22 22 L6 14 Z"/><path d="M6 22 L22 30 L38 22"/><path d="M6 30 L22 38 L38 30"/></g>
<text x="538" y="158" font-size="25" font-weight="700" fill="#f2f2f2">Architecture</text>
<text x="538" y="190" font-size="14.5" fill="#a1a1aa">Config, Docker, dependency</text><text x="538" y="212" font-size="14.5" fill="#a1a1aa">health, compatibility and</text><text x="538" y="234" font-size="14.5" fill="#a1a1aa">env validation.</text>
<rect x="538" y="264" width="176" height="2" rx="1" fill="#2a2a2e"/>
<rect class="b2" x="538" y="264" width="176" height="2" rx="1" fill="#E7A141"/>
<text class="m" x="538" y="296" font-size="12.5" fill="#6e6e77">config · docker · env</text>
</g><g class="c3">
<rect x="766" y="14" width="224" height="312" rx="18" fill="#151517" stroke="#2a2a2e"/>
<g clip-path="url(#cc3)"><rect x="766" y="14" width="224" height="3" fill="#E7A141" fill-opacity=".85"/><rect class="s3" x="766" y="14" width="90" height="312" fill="url(#sh)"/></g>
<text class="m" x="790" y="54" font-size="14" fill="#E7A141" font-weight="700">04</text>
<g class="i3" transform="translate(790 72)" fill="none" stroke="#E7A141" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#E7A141"><rect x="8" y="14" width="28" height="22" rx="7"/><circle cx="17" cy="25" r="2.6" fill="currentColor"/><circle cx="27" cy="25" r="2.6" fill="currentColor"/><path d="M22 14 V8"/><circle cx="22" cy="6" r="2.2"/><path d="M13 33h18" opacity=".55"/></g>
<text x="790" y="158" font-size="25" font-weight="700" fill="#f2f2f2">Agent-ready</text>
<text x="790" y="190" font-size="14.5" fill="#a1a1aa">Versioned JSON reports and</text><text x="790" y="212" font-size="14.5" fill="#a1a1aa">tool schemas your AI</text><text x="790" y="234" font-size="14.5" fill="#a1a1aa">tools can read.</text>
<rect x="790" y="264" width="176" height="2" rx="1" fill="#2a2a2e"/>
<rect class="b3" x="790" y="264" width="176" height="2" rx="1" fill="#E7A141"/>
<text class="m" x="790" y="296" font-size="12.5" fill="#6e6e77">agent · context</text>
</g>
</svg>
