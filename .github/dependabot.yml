version: 2
updates:
  # Enable version updates for npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 10
    # TypeScript 7 is not yet supported by typescript-eslint (peer range <6.1.0),
    # so `npm ci` fails. Remove this rule once typescript-eslint supports it.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    reviewers:
      - "Ayaalmadhon2004"
      - "Jenan04"
    # Group dependency updates
    groups:
      development:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    # Commit message strategy
    commit-message:
      prefix: "chore(deps):"
      prefix-development: "chore(deps-dev):"
      include: "scope"

  # Keep the SHA-pinned GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci(deps):"
