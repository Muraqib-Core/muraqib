name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          CI: true

      - name: Type checking
        run: npm run type-check
        continue-on-error: false

      - name: Build project
        run: npm run build
        continue-on-error: false

      - name: ESLint validation
        run: npm run lint
        continue-on-error: false

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.node-version }}
          path: dist/
          retention-days: 5

  test-and-coverage:
    name: Test and Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          CI: true

      - name: Run tests with coverage (enforces 85% thresholds)
        run: npm run test:coverage
        continue-on-error: false

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  self-audit:
    name: Self-Audit (muraqib audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          CI: true

      - name: Build project
        run: npm run build

      # Gate: exits 1 on any critical/error finding (warnings and info do not block).
      - name: Audit this repository with its own CLI
        run: npm run self-audit

      - name: Save JSON report
        if: always()
        run: node bin/muraqib.js audit --project . --no-interactive --format json --output muraqib-self-audit.json || true

      - name: Upload self-audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: self-audit-report
          path: muraqib-self-audit.json
          if-no-files-found: ignore
          retention-days: 14

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [lint-and-build, test-and-coverage, self-audit]
    if: always()

    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.lint-and-build.result }}" != "success" ]; then
            echo "❌ Build failed"
            exit 1
          fi
          echo "✓ Build passed"

      - name: Check test status
        run: |
          if [ "${{ needs.test-and-coverage.result }}" != "success" ]; then
            echo "❌ Tests failed"
            exit 1
          fi
          echo "✓ Tests passed"

      - name: Check self-audit status
        run: |
          if [ "${{ needs.self-audit.result }}" != "success" ]; then
            echo "❌ Self-audit failed"
            exit 1
          fi
          echo "✓ Self-audit passed"

      - name: Create success badge
        if: success()
        run: |
          echo "✅ All CI/CD checks passed!"
          echo "- Linting: ✓"
          echo "- Type checking: ✓"
          echo "- Build: ✓"
          echo "- Tests: ✓"
          echo "- Coverage: ✓"
          echo "- Self-audit: ✓"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --production || true

      - name: Check for vulnerable dependencies
        run: npm audit --audit-level=moderate || true
