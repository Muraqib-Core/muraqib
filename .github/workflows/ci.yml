name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        # 20.12.0 is the minimum supported version (package.json engines.node)
        node-version: [20.12.0, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          CI: true

      - name: Type checking
        run: npm run type-check
        continue-on-error: false

      - name: Build project
        run: npm run build
        continue-on-error: false

      - name: ESLint validation
        run: npm run lint
        continue-on-error: false

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.node-version }}
          path: dist/
          retention-days: 5

  test-and-coverage:
    name: Test and Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          CI: true

      - name: Run tests with coverage (enforces 85% thresholds)
        run: npm run test:coverage
        continue-on-error: false

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  self-audit:
    name: Self-Audit (muraqib audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          CI: true

      - name: Build project
        run: npm run build

      # Gate: exits 1 on any critical/error finding (warnings and info do not block).
      - name: Audit this repository with its own CLI
        run: npm run self-audit

      - name: Save JSON report
        if: always()
        run: node bin/muraqib.js audit --project . --no-interactive --format json --output muraqib-self-audit.json || true

      - name: Upload self-audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: self-audit-report
          path: muraqib-self-audit.json
          if-no-files-found: ignore
          retention-days: 14

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [lint-and-build, test-and-coverage, self-audit, package-contents, security-scan]
    if: always()

    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.lint-and-build.result }}" != "success" ]; then
            echo "❌ Build failed"
            exit 1
          fi
          echo "✓ Build passed"

      - name: Check test status
        run: |
          if [ "${{ needs.test-and-coverage.result }}" != "success" ]; then
            echo "❌ Tests failed"
            exit 1
          fi
          echo "✓ Tests passed"

      - name: Check self-audit status
        run: |
          if [ "${{ needs.self-audit.result }}" != "success" ]; then
            echo "❌ Self-audit failed"
            exit 1
          fi
          echo "✓ Self-audit passed"

      - name: Check package contents status
        run: |
          if [ "${{ needs.package-contents.result }}" != "success" ]; then
            echo "❌ Package contents check failed"
            exit 1
          fi
          echo "✓ Package contents passed"

      - name: Check security scan status
        run: |
          if [ "${{ needs.security-scan.result }}" != "success" ]; then
            echo "❌ Security scan failed"
            exit 1
          fi
          echo "✓ Security scan passed"

      - name: Create success badge
        if: success()
        run: |
          echo "✅ All CI/CD checks passed!"
          echo "- Linting: ✓"
          echo "- Type checking: ✓"
          echo "- Build: ✓"
          echo "- Tests: ✓"
          echo "- Coverage: ✓"
          echo "- Self-audit: ✓"

  package-contents:
    name: Package Contents
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          CI: true

      - name: Build project
        run: npm run build

      # Fail if tests/specs or sources leak into the published tarball.
      - name: Verify npm tarball contents
        run: |
          npm pack --dry-run --json > pack.json
          node -e '
            const files = JSON.parse(require("fs").readFileSync("pack.json", "utf8"))[0].files.map((f) => f.path);
            const leaked = files.filter((p) => /(^|\/)(src|tests?|__tests__)\//.test(p) || /\.(spec|test)\.[cm]?[jt]sx?(\.map)?$/.test(p) || (/\.ts$/.test(p) && !/\.d\.ts$/.test(p)));
            if (leaked.length > 0) {
              console.error("Unexpected files in npm tarball:\n" + leaked.join("\n"));
              process.exit(1);
            }
            console.log("Tarball OK: " + files.length + " files, no tests/specs/src.");
          '

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Blocking: high/critical advisories in shipped (production) dependencies fail the job.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
